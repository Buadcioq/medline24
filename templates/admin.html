<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Админка</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#f8fafc;margin:0;padding:40px}.container{max-width:1000px;margin:auto}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:20px}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px}button{background:#1a73e8;color:#fff;padding:12px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer}</style>
</head><body><div class="container">
<h1>Админка — создание страницы города</h1>
<div class="card">
<input id="id" placeholder="id (shymkent)">
<input id="name" placeholder="Название">
<input id="arrival" placeholder="по ...">
<input id="inCity" placeholder="в ...">
<input id="address" placeholder="Адрес">
<input id="map" placeholder="долгота,широта">
<input id="seo_title" placeholder="SEO Title">
<input id="seo_description" placeholder="SEO Description">
<input id="seo_keywords" placeholder="SEO Keywords">
<textarea id="doctors" rows="3" placeholder='[{"name":"","spec":"","photo":"","badge":""}]'></textarea>
<textarea id="reviews" rows="3" placeholder='[{"name":"","photo":"","text":"","tag":""}]'></textarea>
<button onclick="save()">Создать страницу</button>
<p id="link"></p>
</div>
<div class="card"><h2>Города</h2><div id="list"></div></div>
</div>
<script>
async function load(){const r=await fetch('/api/cities');const c=await r.json();document.getElementById('list').innerHTML=c.map(x=>`<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.name}</b> — <a href="/${x.id}" target="_blank">/${x.id}</a></div>`).join('')}
async function save(){const city={id:id.value,name:name.value,arrival:arrival.value,inCity:inCity.value,address:address.value,map:map.value,seo_title:seo_title.value,seo_description:seo_description.value,seo_keywords:seo_keywords.value,doctors:JSON.parse(doctors.value||'[]'),reviews:JSON.parse(reviews.value||'[]')};const r=await fetch('/api/cities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(city)});const j=await r.json();document.getElementById('link').innerHTML=`Страница создана: <a href="${j.url}" target="_blank">${j.url}</a> — автоматически добавлена в меню`;load()}
load()
</script></body></html>
