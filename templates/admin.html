<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>medline24 — Админка</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#f8fafc;margin:0;padding:40px}
.container{max-width:1000px;margin:auto}
.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:20px}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #e2e8f0;border-radius:8px;font-family:inherit}
button{background:#1a73e8;color:#fff;padding:12px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
button:hover{background:#0d5bbf}
.city{border:1px solid #e2e8f0;padding:16px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="container">
  <h1>medline24 — Админка городов</h1>
  <div class="card">
    <h2>Добавить город</h2>
    <input id="name" placeholder="Название (Караганда)">
    <input id="arrival" placeholder="по Караганде">
    <input id="inCity" placeholder="в Караганде">
    <input id="address" placeholder="Адрес">
    <input id="map" placeholder="долгота,широта">
    <textarea id="doctors" rows="4" placeholder='Врачи JSON: [{"name":"...","spec":"...","photo":"...","badge":"..."}]'></textarea>
    <textarea id="reviews" rows="4" placeholder='Отзывы JSON: [{"name":"...","photo":"...","text":"...","tag":"..."}]'></textarea>
    <button onclick="addCity()">Добавить</button>
  </div>
  
  <div class="card">
    <h2>Города</h2>
    <div id="list"></div>
  </div>
</div>

<script>
async function load(){
  const res = await fetch('/api/cities');
  const cities = await res.json();
  document.getElementById('list').innerHTML = cities.map(c=>`
    <div class="city">
      <div>
        <strong>${c.name}</strong> — ${c.doctors?.length||0} врачей, ${c.reviews?.length||0} отзывов
      </div>
      <button onclick="delCity('${c.id}')" style="background:#ef4444">Удалить</button>
    </div>
  `).join('');
}

async function addCity(){
  const city = {
    id: document.getElementById('name').value.toLowerCase().replace(/\s+/g,''),
    name: document.getElementById('name').value,
    arrival: document.getElementById('arrival').value,
    inCity: document.getElementById('inCity').value,
    address: document.getElementById('address').value,
    map: document.getElementById('map').value,
    doctors: JSON.parse(document.getElementById('doctors').value || '[]'),
    reviews: JSON.parse(document.getElementById('reviews').value || '[]')
  };
  await fetch('/api/cities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(city)});
  load();
  alert('Добавлено! Город появится в меню на сайте.');
}

async function delCity(id){
  if(!confirm('Удалить?')) return;
  const cities = await (await fetch('/api/cities')).json();
  const city = cities.find(c=>c.id===id);
  // simple delete by reposting without it - for demo just alert
  alert('Для удаления отредактируйте data/cities.json на сервере');
}

load();
</script>
</body>
</html>
